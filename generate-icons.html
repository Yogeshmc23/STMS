<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>STMS Icon Generator</title>
</head>
<body>
<h2>Student Task Manager — Icon Generator</h2>
<p>Click each button to download an icon, then move the downloaded files into client/public.</p>
<svg id="icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <rect width="64" height="64" rx="12" fill="#2563eb"/>
  <rect x="15" y="13" width="34" height="40" rx="4" fill="#ffffff"/>
  <path d="M22 25l4 4 7-8M22 38l4 4 7-8" fill="none" stroke="#2563eb" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M36 26h7M36 39h7" stroke="#2563eb" stroke-width="3" stroke-linecap="round"/>
</svg>
<div id="buttons"></div>
<script>
const sizes = [
  [192, "pwa-192x192.png"],
  [512, "pwa-512x512.png"],
  [180, "apple-touch-icon.png"]
];
for (const [size, name] of sizes) {
  const button = document.createElement("button");
  button.textContent = `Download ${name}`;
  button.style.cssText = "display:block;margin:12px;padding:10px;cursor:pointer";
  button.onclick = () => {
    const svg = document.querySelector("#icon").cloneNode(true);
    svg.setAttribute("width", size);
    svg.setAttribute("height", size);
    const blob = new Blob([new XMLSerializer().serializeToString(svg)], {type:"image/svg+xml;charset=utf-8"});
    const url = URL.createObjectURL(blob);
    const img = new Image();
    img.onload = () => {
      const canvas = document.createElement("canvas");
      canvas.width = size;
      canvas.height = size;
      canvas.getContext("2d").drawImage(img, 0, 0, size, size);
      URL.revokeObjectURL(url);
      canvas.toBlob(png => {
        const a = document.createElement("a");
        a.href = URL.createObjectURL(png);
        a.download = name;
        a.click();
        setTimeout(() => URL.revokeObjectURL(a.href), 1000);
      }, "image/png");
    };
    img.src = url;
  };
  document.querySelector("#buttons").appendChild(button);
}
</script>
</body>
</html>
